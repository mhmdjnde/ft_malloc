<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1078" viewBox="0 0 780 1078" role="img">
<title>free step by step, on the same two allocations</title>
<desc>free validates the pointer against the zone list before touching any header, then marks the block free and merges it with whichever neighbours are also free. The first free can merge nothing because its next neighbour is still in use. The second free merges forward into the tail and backward into the first block, leaving the zone as one single free block, which is kept rather than unmapped because it is the last small zone. A large zone is unmapped immediately.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bx{fill:#ffffff;stroke:#B4B2A9;stroke-width:.5}
.hd{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.hdt{fill:#3C3489;font-weight:500;font-size:14px}
.gy{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.gyt{fill:#2C2C2A;font-weight:500;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.gys{fill:#5F5E5A;font-size:11px}
.tl{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.tlt{fill:#04342C;font-weight:500;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tls{fill:#0F6E56;font-size:11px}
.rd{fill:#FBEDEA;stroke:#9B3A28;stroke-width:.5}
.rdt{fill:#6B2418;font-weight:500;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.rds{fill:#9B3A28;font-size:11px}
.ti{fill:#2C2C2A;font-weight:600;font-size:15px}
.r{fill:#444441;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.rs{fill:#5F5E5A;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace}
.lb{fill:#2C2C2A;font-size:12px;font-weight:500}
.ar{stroke:#5F5E5A;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){
.bx{fill:#1c1c1b;stroke:#5F5E5A}
.hd{fill:#3C3489;stroke:#AFA9EC}
.hdt{fill:#CECBF6}
.gy{fill:#444441;stroke:#B4B2A9}
.gyt{fill:#F1EFE8}
.gys{fill:#D3D1C7}
.tl{fill:#085041;stroke:#5DCAA5}
.tlt{fill:#9FE1CB}
.tls{fill:#9FE1CB}
.rd{fill:#5C2116;stroke:#E8A091}
.rdt{fill:#F6C9BF}
.rds{fill:#F6C9BF}
.ti{fill:#F1EFE8}
.r{fill:#D3D1C7}
.rs{fill:#B4B2A9}
.lb{fill:#F1EFE8}
.ar{stroke:#B4B2A9}
}
</style>
</defs>

<text class="ti" x="30" y="26">free(p1) then free(p2) — the same small zone from malloc_two_calls</text>

<text class="lb" x="30" y="52">starting point: 256 and 512 handed out, the rest free</text>
<rect class="gy" x="30" y="60" width="80" height="40" rx="3"/>
<text class="r" x="70" y="85" text-anchor="middle">t_zone</text>
<rect class="gy" x="110" y="60" width="50" height="40" rx="3"/>
<text class="r" x="135" y="85" text-anchor="middle">hdr</text>
<rect class="tl" x="160" y="60" width="130" height="40" rx="3"/>
<text class="tlt" x="225" y="85" text-anchor="middle">256 used</text>
<rect class="gy" x="290" y="60" width="50" height="40" rx="3"/>
<text class="r" x="315" y="85" text-anchor="middle">hdr</text>
<rect class="tl" x="340" y="60" width="150" height="40" rx="3"/>
<text class="tlt" x="415" y="85" text-anchor="middle">512 used</text>
<rect class="gy" x="490" y="60" width="50" height="40" rx="3"/>
<text class="r" x="515" y="85" text-anchor="middle">hdr</text>
<rect class="bx" x="540" y="60" width="210" height="40" rx="3"/>
<text class="r" x="645" y="85" text-anchor="middle">105600 free</text>
<text class="rs" x="30" y="114">0x…A000</text>
<text class="rs" x="160" y="114">p1 = 0x…A040</text>
<text class="rs" x="340" y="114">p2 = 0x…A160</text>

<rect class="hd" x="30" y="134" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="153">free(p1) — nothing to merge with</text>
<text class="tls" x="738" y="153" text-anchor="end">next is still in use, prev is NULL</text>

<rect class="gy" x="30" y="174" width="166" height="54" rx="4"/>
<text class="gyt" x="113" y="195" text-anchor="middle">find_zone</text>
<text class="gys" x="113" y="214" text-anchor="middle">p1 inside 0x…A000 ✓</text>
<line class="ar" x1="196" y1="201" x2="210" y2="201" marker-end="url(#arrow)"/>

<rect class="gy" x="212" y="174" width="166" height="54" rx="4"/>
<text class="gyt" x="295" y="195" text-anchor="middle">find_block</text>
<text class="gys" x="295" y="214" text-anchor="middle">block+1 == p1 ✓</text>
<line class="ar" x1="378" y1="201" x2="392" y2="201" marker-end="url(#arrow)"/>

<rect class="gy" x="394" y="174" width="166" height="54" rx="4"/>
<text class="gyt" x="477" y="195" text-anchor="middle">block-&gt;free = 1</text>
<text class="gys" x="477" y="214" text-anchor="middle">the only write</text>
<line class="ar" x1="560" y1="201" x2="574" y2="201" marker-end="url(#arrow)"/>

<rect class="gy" x="576" y="174" width="174" height="54" rx="4"/>
<text class="gyt" x="663" y="195" text-anchor="middle">merge_block</text>
<text class="gys" x="663" y="214" text-anchor="middle">both sides say no</text>

<rect class="gy" x="30" y="248" width="80" height="40" rx="3"/>
<text class="r" x="70" y="273" text-anchor="middle">t_zone</text>
<rect class="gy" x="110" y="248" width="50" height="40" rx="3"/>
<text class="r" x="135" y="273" text-anchor="middle">hdr</text>
<rect class="bx" x="160" y="248" width="130" height="40" rx="3"/>
<text class="r" x="225" y="273" text-anchor="middle">256 FREE</text>
<rect class="gy" x="290" y="248" width="50" height="40" rx="3"/>
<text class="r" x="315" y="273" text-anchor="middle">hdr</text>
<rect class="tl" x="340" y="248" width="150" height="40" rx="3"/>
<text class="tlt" x="415" y="273" text-anchor="middle">512 used</text>
<rect class="gy" x="490" y="248" width="50" height="40" rx="3"/>
<text class="r" x="515" y="273" text-anchor="middle">hdr</text>
<rect class="bx" x="540" y="248" width="210" height="40" rx="3"/>
<text class="r" x="645" y="273" text-anchor="middle">105600 free</text>
<text class="lb" x="30" y="308">still 3 blocks. two free holes separated by a used block — this is fragmentation</text>

<rect class="hd" x="30" y="328" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="347">free(p2) — merges BOTH ways</text>
<text class="tls" x="738" y="347" text-anchor="end">this is what prev exists for</text>

<rect class="gy" x="30" y="368" width="340" height="54" rx="4"/>
<text class="gyt" x="200" y="389" text-anchor="middle">1. forward: next is free</text>
<text class="gys" x="200" y="408" text-anchor="middle">512 + 32 (its header) + 105600 = 106144</text>
<line class="ar" x1="370" y1="395" x2="392" y2="395" marker-end="url(#arrow)"/>
<rect class="gy" x="394" y="368" width="356" height="54" rx="4"/>
<text class="gyt" x="572" y="389" text-anchor="middle">2. backward: prev is free</text>
<text class="gys" x="572" y="408" text-anchor="middle">256 + 32 (our header) + 106144 = 106432</text>

<text class="lb" x="30" y="446">each merge swallows the header between the two blocks — that is where the 32 comes from</text>

<rect class="gy" x="30" y="460" width="80" height="40" rx="3"/>
<text class="r" x="70" y="485" text-anchor="middle">t_zone</text>
<rect class="gy" x="110" y="460" width="50" height="40" rx="3"/>
<text class="r" x="135" y="485" text-anchor="middle">hdr</text>
<rect class="bx" x="160" y="460" width="590" height="40" rx="3"/>
<text class="r" x="455" y="485" text-anchor="middle">106432 FREE — one single block, prev = next = NULL</text>
<text class="rs" x="30" y="514">0x…A000</text>
<text class="rs" x="160" y="514">0x…A040</text>
<text class="gys" x="750" y="514" text-anchor="end">106496 − 32 − 32 = 106432, the whole zone again</text>

<rect class="hd" x="30" y="534" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="553">release_zone — the zone is empty, but it stays</text>
<text class="tls" x="738" y="553" text-anchor="end">it is the last small zone</text>

<rect class="gy" x="30" y="574" width="230" height="54" rx="4"/>
<text class="gyt" x="145" y="595" text-anchor="middle">one block and free?</text>
<text class="gys" x="145" y="614" text-anchor="middle">yes → candidate</text>
<line class="ar" x1="260" y1="601" x2="278" y2="601" marker-end="url(#arrow)"/>
<rect class="rd" x="280" y="574" width="230" height="54" rx="4"/>
<text class="rdt" x="395" y="595" text-anchor="middle">kind != 2 and only 1 left?</text>
<text class="rds" x="395" y="614" text-anchor="middle">yes → return, keep it</text>
<line class="ar" x1="510" y1="601" x2="528" y2="601" marker-end="url(#arrow)"/>
<rect class="gy" x="530" y="574" width="220" height="54" rx="4"/>
<text class="gyt" x="640" y="595" text-anchor="middle">no munmap</text>
<text class="gys" x="640" y="614" text-anchor="middle">next malloc costs 0 syscalls</text>

<text class="lb" x="30" y="652">a malloc/free loop would otherwise mmap and munmap forever. verified: 20000 cycles, zone count unchanged</text>

<rect class="hd" x="30" y="672" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="691">free(L) on a LARGE zone — unmapped straight away</text>
<text class="tls" x="738" y="691" text-anchor="end">one allocation per zone, so nothing else is in there</text>

<rect class="gy" x="30" y="712" width="80" height="40" rx="3"/>
<text class="r" x="70" y="737" text-anchor="middle">t_zone</text>
<rect class="gy" x="110" y="712" width="50" height="40" rx="3"/>
<text class="r" x="135" y="737" text-anchor="middle">hdr</text>
<rect class="tl" x="160" y="712" width="390" height="40" rx="3"/>
<text class="tlt" x="355" y="737" text-anchor="middle">5008 used</text>
<rect class="bx" x="550" y="712" width="200" height="40" rx="3"/>
<text class="r" x="650" y="737" text-anchor="middle">3120 slack</text>
<path class="ar" d="M390 752 V772" marker-end="url(#arrow)"/>
<rect class="rd" x="230" y="774" width="320" height="30" rx="4"/>
<text class="rdt" x="390" y="794" text-anchor="middle">munmap(zone, 8192) — all of it</text>

<rect class="bx" x="30" y="824" width="350" height="230" rx="4"/>
<rect class="hd" x="30" y="824" width="350" height="26" rx="4"/>
<text class="hdt" x="205" y="842" text-anchor="middle">validated, never dereferenced</text>
<text xml:space="preserve" class="rs" x="42" y="866">free(NULL)              no-op</text>
<text xml:space="preserve" class="rs" x="42" y="885">free(0x1234)            find_zone → NULL</text>
<text xml:space="preserve" class="rs" x="42" y="904">free(&amp;stack_var)        find_zone → NULL</text>
<text xml:space="preserve" class="rs" x="42" y="923">free(p1 + 8)            find_block → NULL</text>
<text xml:space="preserve" class="rs" x="42" y="942">free(header address)    find_block → NULL</text>
<text xml:space="preserve" class="rs" x="42" y="961">free(p1) twice          free == 1 already</text>
<text class="gys" x="42" y="984">the order matters: we prove the pointer is ours</text>
<text class="gys" x="42" y="999">by walking OUR lists, before reading any header</text>
<text class="gys" x="42" y="1020">reading (t_block *)ptr - 1 first would be the</text>
<text class="gys" x="42" y="1035">segfault we are trying to avoid</text>

<rect class="bx" x="400" y="824" width="350" height="230" rx="4"/>
<rect class="hd" x="400" y="824" width="350" height="26" rx="4"/>
<text class="hdt" x="575" y="842" text-anchor="middle">block list, before and after</text>
<text class="gys" x="412" y="864">after 2 mallocs</text>
<text xml:space="preserve" class="rs" x="412" y="882">A0020 256    free=0  next=A0140</text>
<text xml:space="preserve" class="rs" x="412" y="899">A0140 512    free=0  next=A0360</text>
<text xml:space="preserve" class="rs" x="412" y="916">A0360 105600 free=1  next=NULL</text>
<text class="gys" x="412" y="940">after free(p1)</text>
<text xml:space="preserve" class="rs" x="412" y="958">A0020 256    free=1  next=A0140</text>
<text xml:space="preserve" class="rs" x="412" y="975">A0140 512    free=0  next=A0360</text>
<text xml:space="preserve" class="rs" x="412" y="992">A0360 105600 free=1  next=NULL</text>
<text class="gys" x="412" y="1016">after free(p2)</text>
<rect class="tl" x="406" y="1022" width="338" height="20" rx="3"/>
<text xml:space="preserve" class="rs" x="412" y="1036">A0020 106432 free=1  next=NULL</text>
</svg>

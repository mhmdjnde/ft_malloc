<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1046" viewBox="0 0 780 1046" role="img">
<title>Three allocations step by step: malloc(256), malloc(512), malloc(5000)</title>
<desc>The first call finds no zone, so it mmaps one, writes the zone and block headers, splits the single free block and returns the payload address. The second call of the same class finds the surviving zone through the global, splits the leftover block and returns without any syscall. The third call is LARGE, so it skips searching and splitting entirely and gets a mapping of its own holding exactly one block.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bx{fill:#ffffff;stroke:#B4B2A9;stroke-width:.5}
.hd{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.hdt{fill:#3C3489;font-weight:500;font-size:14px}
.gy{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.gyt{fill:#2C2C2A;font-weight:500;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.gys{fill:#5F5E5A;font-size:11px}
.tl{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.tlt{fill:#04342C;font-weight:500;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tls{fill:#0F6E56;font-size:11px}
.ti{fill:#2C2C2A;font-weight:600;font-size:15px}
.r{fill:#444441;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.rs{fill:#5F5E5A;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace}
.lb{fill:#2C2C2A;font-size:12px;font-weight:500}
.ar{stroke:#5F5E5A;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){
.bx{fill:#1c1c1b;stroke:#5F5E5A}
.hd{fill:#3C3489;stroke:#AFA9EC}
.hdt{fill:#CECBF6}
.gy{fill:#444441;stroke:#B4B2A9}
.gyt{fill:#F1EFE8}
.gys{fill:#D3D1C7}
.tl{fill:#085041;stroke:#5DCAA5}
.tlt{fill:#9FE1CB}
.tls{fill:#9FE1CB}
.ti{fill:#F1EFE8}
.r{fill:#D3D1C7}
.rs{fill:#B4B2A9}
.lb{fill:#F1EFE8}
.ar{stroke:#B4B2A9}
}
</style>
</defs>

<text class="ti" x="30" y="26">malloc(256), malloc(512), malloc(5000) — step by step, real addresses</text>

<rect class="hd" x="30" y="44" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="63">CALL 1 — malloc(256)</text>
<text class="tls" x="738" y="63" text-anchor="end">no zone exists yet → 1 mmap</text>

<rect class="gy" x="30" y="84" width="132" height="54" rx="4"/>
<text class="gyt" x="96" y="105" text-anchor="middle">align_up</text>
<text class="gys" x="96" y="124" text-anchor="middle">256 → 256</text>
<line class="ar" x1="162" y1="111" x2="174" y2="111" marker-end="url(#arrow)"/>

<rect class="gy" x="176" y="84" width="132" height="54" rx="4"/>
<text class="gyt" x="242" y="105" text-anchor="middle">get_kind</text>
<text class="gys" x="242" y="124" text-anchor="middle">→ 1 (small)</text>
<line class="ar" x1="308" y1="111" x2="320" y2="111" marker-end="url(#arrow)"/>

<rect class="gy" x="322" y="84" width="132" height="54" rx="4"/>
<text class="gyt" x="388" y="105" text-anchor="middle">find_free_block</text>
<text class="gys" x="388" y="124" text-anchor="middle">→ NULL, nothing yet</text>
<line class="ar" x1="454" y1="111" x2="466" y2="111" marker-end="url(#arrow)"/>

<rect class="gy" x="468" y="84" width="132" height="54" rx="4"/>
<text class="gyt" x="534" y="105" text-anchor="middle">create_zone</text>
<text class="gys" x="534" y="124" text-anchor="middle">mmap 106496 B</text>
<line class="ar" x1="600" y1="111" x2="612" y2="111" marker-end="url(#arrow)"/>

<rect class="gy" x="614" y="84" width="136" height="54" rx="4"/>
<text class="gyt" x="682" y="105" text-anchor="middle">split_block</text>
<text class="gys" x="682" y="124" text-anchor="middle">one block → two</text>

<text class="lb" x="30" y="164">after create_zone — ONE free block covering everything</text>
<text class="gys" x="750" y="164" text-anchor="end">bars are schematic, not to scale</text>
<rect class="gy" x="30" y="172" width="90" height="40" rx="3"/>
<text class="r" x="75" y="197" text-anchor="middle">t_zone 32</text>
<rect class="gy" x="120" y="172" width="80" height="40" rx="3"/>
<text class="r" x="160" y="197" text-anchor="middle">hdr 32</text>
<rect class="bx" x="200" y="172" width="550" height="40" rx="3"/>
<text class="r" x="475" y="197" text-anchor="middle">106432 bytes — free = 1</text>
<text class="rs" x="30" y="226">0x…d000</text>
<text class="rs" x="120" y="226">0x…d020</text>
<text class="rs" x="200" y="226">0x…d040</text>

<text class="lb" x="30" y="254">after split_block, then malloc does block-&gt;free = 0</text>
<rect class="gy" x="30" y="262" width="90" height="40" rx="3"/>
<text class="r" x="75" y="287" text-anchor="middle">t_zone 32</text>
<rect class="gy" x="120" y="262" width="60" height="40" rx="3"/>
<text class="r" x="150" y="287" text-anchor="middle">hdr</text>
<rect class="tl" x="180" y="262" width="150" height="40" rx="3"/>
<text class="tlt" x="255" y="287" text-anchor="middle">256 — free=0</text>
<rect class="gy" x="330" y="262" width="60" height="40" rx="3"/>
<text class="r" x="360" y="287" text-anchor="middle">hdr</text>
<rect class="bx" x="390" y="262" width="360" height="40" rx="3"/>
<text class="r" x="570" y="287" text-anchor="middle">106144 — free = 1 (the tail)</text>
<text class="rs" x="30" y="316">0x…d000</text>
<text class="rs" x="120" y="316">0x…d020</text>
<text class="rs" x="180" y="316">0x…d040</text>
<text class="rs" x="330" y="316">0x…d140</text>
<text class="rs" x="390" y="316">0x…d160</text>

<rect class="tl" x="180" y="330" width="150" height="26" rx="4"/>
<text class="tlt" x="255" y="348" text-anchor="middle">returns 0x…d040</text>
<text class="gys" x="342" y="348">the payload, 32 bytes past its header. 0x40 = 64, divisible by 16</text>

<rect class="hd" x="30" y="374" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="393">CALL 2 — malloc(512)</text>
<text class="tls" x="738" y="393" text-anchor="end">zone survives in g_arena.zones[1] → 0 syscalls</text>

<rect class="gy" x="30" y="414" width="166" height="54" rx="4"/>
<text class="gyt" x="113" y="435" text-anchor="middle">align_up</text>
<text class="gys" x="113" y="454" text-anchor="middle">512 → 512</text>
<line class="ar" x1="196" y1="441" x2="210" y2="441" marker-end="url(#arrow)"/>

<rect class="gy" x="212" y="414" width="166" height="54" rx="4"/>
<text class="gyt" x="295" y="435" text-anchor="middle">get_kind</text>
<text class="gys" x="295" y="454" text-anchor="middle">→ 1 (small), same class</text>
<line class="ar" x1="378" y1="441" x2="392" y2="441" marker-end="url(#arrow)"/>

<rect class="tl" x="394" y="414" width="166" height="54" rx="4"/>
<text class="tlt" x="477" y="435" text-anchor="middle">find_free_block</text>
<text class="tls" x="477" y="454" text-anchor="middle">walks 2, FOUND 0x…d140</text>
<line class="ar" x1="560" y1="441" x2="574" y2="441" marker-end="url(#arrow)"/>

<rect class="gy" x="576" y="414" width="174" height="54" rx="4"/>
<text class="gyt" x="663" y="435" text-anchor="middle">split_block</text>
<text class="gys" x="663" y="454" text-anchor="middle">cuts 512 off the tail</text>

<text class="lb" x="30" y="492">the whole create_zone branch is SKIPPED — no zone_size, no mmap, no new zone</text>

<text class="lb" x="30" y="520">after split_block</text>
<rect class="gy" x="30" y="528" width="80" height="40" rx="3"/>
<text class="r" x="70" y="553" text-anchor="middle">t_zone</text>
<rect class="gy" x="110" y="528" width="50" height="40" rx="3"/>
<text class="r" x="135" y="553" text-anchor="middle">hdr</text>
<rect class="tl" x="160" y="528" width="130" height="40" rx="3"/>
<text class="tlt" x="225" y="553" text-anchor="middle">256 used</text>
<rect class="gy" x="290" y="528" width="50" height="40" rx="3"/>
<text class="r" x="315" y="553" text-anchor="middle">hdr</text>
<rect class="tl" x="340" y="528" width="150" height="40" rx="3"/>
<text class="tlt" x="415" y="553" text-anchor="middle">512 used</text>
<rect class="gy" x="490" y="528" width="50" height="40" rx="3"/>
<text class="r" x="515" y="553" text-anchor="middle">hdr</text>
<rect class="bx" x="540" y="528" width="210" height="40" rx="3"/>
<text class="r" x="645" y="553" text-anchor="middle">105600 free</text>
<text class="rs" x="30" y="582">0x…d000</text>
<text class="rs" x="160" y="582">0x…d040</text>
<text class="rs" x="340" y="582">0x…d160</text>
<text class="rs" x="540" y="582">0x…d380</text>

<rect class="tl" x="340" y="596" width="150" height="26" rx="4"/>
<text class="tlt" x="415" y="614" text-anchor="middle">returns 0x…d160</text>
<text class="gys" x="502" y="614">288 bytes after call 1's pointer = 256 of data + 32 of header</text>

<rect class="hd" x="30" y="640" width="720" height="28" rx="4"/>
<text class="hdt" x="42" y="659">CALL 3 — malloc(5000)</text>
<text class="tls" x="738" y="659" text-anchor="end">LARGE → its own mmap, every time</text>

<rect class="gy" x="30" y="680" width="166" height="54" rx="4"/>
<text class="gyt" x="113" y="701" text-anchor="middle">align_up</text>
<text class="gys" x="113" y="720" text-anchor="middle">5000 → 5008</text>
<line class="ar" x1="196" y1="707" x2="210" y2="707" marker-end="url(#arrow)"/>

<rect class="gy" x="212" y="680" width="166" height="54" rx="4"/>
<text class="gyt" x="295" y="701" text-anchor="middle">get_kind</text>
<text class="gys" x="295" y="720" text-anchor="middle">→ 2 (large)</text>
<line class="ar" x1="378" y1="707" x2="392" y2="707" marker-end="url(#arrow)"/>

<rect class="gy" x="394" y="680" width="166" height="54" rx="4"/>
<text class="gyt" x="477" y="701" text-anchor="middle">create_zone</text>
<text class="gys" x="477" y="720" text-anchor="middle">mmap 8192 B (2 pages)</text>
<line class="ar" x1="560" y1="707" x2="574" y2="707" marker-end="url(#arrow)"/>

<rect class="gy" x="576" y="680" width="174" height="54" rx="4"/>
<text class="gyt" x="663" y="701" text-anchor="middle">block-&gt;size = 5008</text>
<text class="gys" x="663" y="720" text-anchor="middle">report what was asked</text>

<text class="lb" x="30" y="758">no find_free_block, no split_block — one allocation per large zone, so free() can just munmap it</text>

<rect class="gy" x="30" y="766" width="80" height="40" rx="3"/>
<text class="r" x="70" y="791" text-anchor="middle">t_zone</text>
<rect class="gy" x="110" y="766" width="60" height="40" rx="3"/>
<text class="r" x="140" y="791" text-anchor="middle">hdr</text>
<rect class="tl" x="170" y="766" width="380" height="40" rx="3"/>
<text class="tlt" x="360" y="791" text-anchor="middle">5008 used — the only block, prev = next = NULL</text>
<rect class="bx" x="550" y="766" width="200" height="40" rx="3"/>
<text class="r" x="650" y="791" text-anchor="middle">3120 slack</text>
<text class="rs" x="30" y="820">0x…4000</text>
<text class="rs" x="170" y="820">0x…4040</text>
<text class="rs" x="550" y="820">0x…53d0</text>
<text class="rs" x="694" y="820">0x…6000</text>

<rect class="tl" x="170" y="834" width="150" height="26" rx="4"/>
<text class="tlt" x="245" y="852" text-anchor="middle">returns 0x…4040</text>
<text class="gys" x="332" y="852">the 3120 bytes of page rounding belong to nobody and stay unused</text>

<rect class="bx" x="30" y="878" width="350" height="158" rx="4"/>
<rect class="hd" x="30" y="878" width="350" height="26" rx="4"/>
<text class="hdt" x="205" y="896" text-anchor="middle">every byte split_block wrote (call 1)</text>
<text class="rs" x="42" y="919">0x…d020 size   106432 → 256</text>
<text class="rs" x="42" y="938">0x…d020 next   NULL   → 0x…d140</text>
<text class="rs" x="42" y="957">0x…d140 size   —      → 106144</text>
<text class="rs" x="42" y="976">0x…d140 free   —      → 1</text>
<text class="rs" x="42" y="995">0x…d140 prev   —      → 0x…d020</text>
<text class="rs" x="42" y="1014">0x…d020 free   1      → 0   (malloc)</text>
<text class="gys" x="42" y="1030">your 256 bytes were never touched</text>

<rect class="bx" x="400" y="878" width="350" height="158" rx="4"/>
<rect class="hd" x="400" y="878" width="350" height="26" rx="4"/>
<text class="hdt" x="575" y="896" text-anchor="middle">the one global, and the tally</text>
<text class="rs" x="412" y="919">g_arena.zones[0] = NULL   no tiny yet</text>
<rect class="tl" x="406" y="926" width="338" height="20" rx="3"/>
<text class="rs" x="412" y="940">g_arena.zones[1] = 0x…d000  calls 1+2</text>
<rect class="tl" x="406" y="947" width="338" height="20" rx="3"/>
<text class="rs" x="412" y="961">g_arena.zones[2] = 0x…4000  call 3</text>
<text class="rs" x="412" y="988">mmap calls      1 → 0 → 1</text>
<text class="rs" x="412" y="1007">blocks walked   1 → 2 → 0</text>
<text class="gys" x="412" y="1030">small zone: 32+32+256+32+512+32+105600 = 106496</text>
</svg>
